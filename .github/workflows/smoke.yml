name: smoke

on:
  pull_request:
  push:
    branches: [main]

jobs:
  companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: companions/loom/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install companion dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: companions/loom
      - name: Companion tests and typecheck
        run: |
          npm test </dev/null
          npm run typecheck </dev/null
          python -m unittest discover -s scripts -p 'test_*.py' </dev/null
          python scripts/package_release.py --output "$RUNNER_TEMP/Loom-Companion.zip"
        working-directory: companions/loom

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
        working-directory: engine
      - name: Build
        run: npm run build
        working-directory: engine
      - name: Repository guards and script tests
        run: npm run test:repo
        working-directory: engine
      - name: Typecheck
        run: npm run lint
        working-directory: engine
      - name: Desktop boundary tests
        run: npm test
        working-directory: desktop
      - name: Smoke tests
        run: npm run smoke
        working-directory: engine

  # The installer ships `resources/engine`; the staged-tree tests skip themselves when it is
  # absent, so this job stages first and then fails if anything is missing. The bundled gh.exe
  # comes from the network, so it is not staged in pull-request CI.
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            engine/package-lock.json
            desktop/package-lock.json
      - name: Install engine
        run: npm ci --no-audit --no-fund --ignore-scripts
        working-directory: engine
      - name: Build engine
        run: npm run build
        working-directory: engine
      - name: Install desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: desktop
      - name: Stage the engine tree
        run: node scripts/stage-engine.mjs
        working-directory: desktop
      - name: Desktop tests
        run: npm test
        working-directory: desktop

  # This job proves the daemon typechecks and the platform-boundary tests pass on the shipped
  # target: the executable resolver, the process identity and tree kill, the mailbox roots, and the
  # worker-written-file boundary. It also runs the repository guards, which must not be silent
  # no-ops on Windows.
  windows-native:
    runs-on: windows-latest
    steps:
      # No `symlinks` input: actions/checkout has none, and the repository tracks no symlink at all, so
      # a Windows checkout writes exactly what the index holds.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engine/package-lock.json
      # better-sqlite3 ships a win32-x64 N-API prebuild in its tarball, so the node-gyp rebuild its
      # install script would run is unnecessary and would fail on a runner without a compiler.
      - name: Install
        run: npm ci --no-audit --no-fund --ignore-scripts
        working-directory: engine
      # The build compiles every workspace in dependency order (i18n before the daemon that imports
      # it), so it is also this job's typecheck; the CLI's package exports point at that dist.
      - name: Build engine
        run: npm run build
        working-directory: engine
      - name: Repository guards and script tests
        run: npm run test:repo
        working-directory: engine
      - name: Native platform tests
        run: npx vitest run --maxWorkers=2 packages/daemon/test/source-brand.test.ts packages/daemon/test/data-paths.test.ts packages/daemon/test/platform.test.ts packages/daemon/test/executable-resolver.test.ts packages/daemon/test/process-identity.test.ts packages/daemon/test/unisolated-roots.test.ts packages/daemon/test/team-workspace-windows.test.ts packages/daemon/test/team-workspace-line-endings.test.ts packages/daemon/test/attempt-completion-windows.test.ts packages/daemon/test/worktree-policy.test.ts packages/daemon/test/team-control-paths.test.ts packages/daemon/test/team-setup.test.ts packages/daemon/test/team-project-files.test.ts packages/daemon/test/team-attachments.test.ts packages/daemon/test/project-bootstrap-limits.test.ts packages/daemon/test/team-github.test.ts packages/daemon/test/project-bootstrap.test.ts packages/daemon/test/child-process-supervisor.test.ts packages/daemon/test/native-pairing.test.ts packages/daemon/test/u4-recovery.test.ts packages/daemon/test/worker-trees-shutdown.test.ts packages/daemon/test/desktop-dependencies.test.ts packages/daemon/test/windows-hide-child-processes.test.ts packages/daemon/test/db-upgrades.test.ts packages/daemon/test/worker-mailbox-pipe-windows.test.ts
        working-directory: engine
      - name: Native CLI tests
        run: npx vitest run --maxWorkers=2 packages/cli/test/daemon-stop-windows.test.ts packages/cli/test/daemon-stop-outcome.test.ts packages/cli/test/daemon-start-port.test.ts packages/cli/test/thin-cli.test.ts packages/cli/test/github-command.test.ts packages/cli/test/github-sign-in.test.ts packages/cli/test/team-start.test.ts packages/cli/test/team-setup.test.ts packages/cli/test/team-chat.test.ts packages/cli/test/team-apply.test.ts packages/cli/test/team-merge.test.ts
        working-directory: engine
      - name: Native additional-client tests
        run: npx vitest run --maxWorkers=2 packages/daemon/test/gemini-launch-argv.test.ts packages/daemon/test/gemini-worker-events.test.ts packages/daemon/test/gemini-native-client.test.ts packages/daemon/test/worker-event-normalizer.test.ts packages/daemon/test/direct-worker-launch.test.ts packages/daemon/test/direct-worker-retention.test.ts packages/daemon/test/native-model-choices.test.ts packages/daemon/test/team-settings.test.ts packages/daemon/test/team-model-policy.test.ts packages/daemon/test/framework-invocation.test.ts packages/daemon/test/system-health.test.ts packages/daemon/test/setup.test.ts packages/daemon/test/agent-sign-in.test.ts
        working-directory: engine
