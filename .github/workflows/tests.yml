# The full test suites, on both hosts the product ships to. `smoke.yml` runs the focused set on
# every PR; this workflow is the release gate the owner set on 2026-11-17: a suite that is only
# green on one host drifts on the other, and nothing notices until a release.
#
# `--maxWorkers=2` is kept because the suites spawn real child processes and bind sockets. The
# daemon suite is the long pole, so it is split into three shards; `--shard` is vitest's own
# partitioner, so every file runs in exactly one shard.
name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  daemon:
    strategy:
      fail-fast: false
      # The shard count is per host. Windows runs the git-heavy files slowly enough that a
      # smaller count puts two of them in one job, and a job whose worker runs longer than
      # vitest's 60 s reporting deadline exits 1 with every test passing. Linux stays at three:
      # the whole suite finishes in about a minute per shard there, and extra jobs would only
      # add runners.
      matrix:
        include:
          - { os: ubuntu-latest, shard: 1, total: 3 }
          - { os: ubuntu-latest, shard: 2, total: 3 }
          - { os: ubuntu-latest, shard: 3, total: 3 }
          - { os: windows-latest, shard: 1, total: 8 }
          - { os: windows-latest, shard: 2, total: 8 }
          - { os: windows-latest, shard: 3, total: 8 }
          - { os: windows-latest, shard: 4, total: 8 }
          - { os: windows-latest, shard: 5, total: 8 }
          - { os: windows-latest, shard: 6, total: 8 }
          - { os: windows-latest, shard: 7, total: 8 }
          - { os: windows-latest, shard: 8, total: 8 }
    runs-on: ${{ matrix.os }}
    steps:
      # No `symlinks` input: actions/checkout has none, and the repository tracks no symlink at
      # all — every skill and reference file is a regular file in the index. A checkout therefore
      # writes exactly what the index holds on both hosts.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engine/package-lock.json
      # better-sqlite3 ships a win32-x64 N-API prebuild, so the node-gyp rebuild its install
      # script would run is unnecessary and would fail on a runner without a compiler. The CLI's
      # `postinstall` ABI check is likewise skipped and covered by its own test.
      - name: Install
        run: npm ci --no-audit --no-fund --ignore-scripts
        working-directory: engine
      # The daemon suite spawns the real CLI, and the CLI imports @loom/daemon through
      # package exports that point at dist, so the build comes first.
      - name: Build
        run: npm run build
        working-directory: engine
      - name: Daemon suite (shard ${{ matrix.shard }}/${{ matrix.total }})
        run: npx vitest run --maxWorkers=2 --shard=${{ matrix.shard }}/${{ matrix.total }}
        working-directory: engine/packages/daemon

  suites:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund --ignore-scripts
        working-directory: engine
      - name: Build
        run: npm run build
        working-directory: engine
      - name: CLI suite
        run: npx vitest run --maxWorkers=2
        working-directory: engine/packages/cli
      - name: UI suite
        run: npx vitest run --maxWorkers=2
        working-directory: engine/packages/ui
      - name: i18n suite
        run: npm run test
        working-directory: engine/packages/i18n
      - name: Repository guards and script tests
        run: npm run test:repo
        working-directory: engine