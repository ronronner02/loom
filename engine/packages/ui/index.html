<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loom</title>
    <link rel="icon" type="image/png" href="/loom-icon.png" />
    <!-- Resolve the command-center preference before the first application paint. -->
    <script>
      (function () {
        var choice = "light";
        try {
          // A browser from before the rename keeps the preference under the old key; the
          // application moves it, and this first paint must not flash the wrong palette.
          var key = "loom.teamTheme", previous = "multi-agent.teamTheme";
          var stored = localStorage.getItem(key);
          if (stored === null && localStorage.getItem(previous) !== null) {
            stored = localStorage.getItem(previous);
            localStorage.setItem(key, stored);
            localStorage.removeItem(previous);
          }
          if (stored === "light" || stored === "dark" || stored === "system") choice = stored;
        } catch (e) {
          /* An unavailable preference store uses the command-center default. */
        }
        var dark = choice === "dark" || (choice === "system" &&
          (typeof window.matchMedia !== "function" || window.matchMedia("(prefers-color-scheme: dark)").matches));
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
